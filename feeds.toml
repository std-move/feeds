# debugging: dump the whole page source into the feed
# entrySelector = ":root"

[default]
waitUntil = "load"

# see if the basics work
[wikipedia_did_you_know]
title = "Wikipedia — did you know?"
url = "https://en.wikipedia.org/wiki/Main_Page"
waitForSelector = "#mp-dyk > ul li"
entrySelector = "#mp-dyk > ul li"
titleSelector = "b"
linkSelector = "b a"

[exp_view_boom_or_bubble]
title = "AI Boom/Bubble Monitor"
url = "https://boomorbubble.ai/news"
waitForSelector = "tbody tr"
entrySelector = "tbody tr"
titleSelector = ["td:nth-of-type(1)", "td:nth-of-type(4)"]
contentSelector = ["td:nth-of-type(1)", "td:nth-of-type(2)", "td:nth-of-type(3)", "td:nth-of-type(4)"]
linkSelector = "a"

[bitrefill_cz_recently_added_cards]
title = "Bitrefill recently added (CZ)"
url = "https://www.bitrefill.com/cz/en/gift-cards/?s=3"
waitForSelector = "[class*='gridStyles'] a[class*='linkContainer']"
entrySelector = "[class*='gridStyles'] a[class*='linkContainer']"
titleSelector = "h2"
linkSelector = "*"
contentSelector = ["h2", "p[class*='price']"]

[kobo_libra_2_firmware]
title = "Kobo Libra 2 latest firmware"
url = "https://pgaskin.net/KoboStuff/kobofirmware.html"
waitForSelector = "xpath=//*[@id='section-latest']//tbody//tr[.//*[contains(@class,'kfw-latest__hardware') and normalize-space(.)='kobo9']]"
entrySelector = "xpath=//*[@id='section-latest']//tbody//tr[.//*[contains(@class,'kfw-latest__hardware') and normalize-space(.)='kobo9']]"
titleSelector = [".kfw-latest__model", ".kfw-latest__version"]
linkSelector = "a.kfw-latest__links__notes"
contentSelector = [".kfw-latest__model", ".kfw-latest__hardware", ".kfw-latest__version", ".kfw-latest__date"]

[moz_addon_remove_youtube_suggestions]
title = "RYS — Remove YouTube Suggestions versions"
url = "https://addons.mozilla.org/en-US/firefox/addon/remove-youtube-s-suggestions/versions/"
waitForSelector = ".AddonVersionCard"
entrySelector = ".AddonVersionCard"
titleSelector = ".AddonVersionCard-version"
contentSelector = [".AddonVersionCard-fileInfo", ".AddonVersionCard-releaseNotes"]

[tapology_upcoming_events]
title = "Tapology - upcoming events"
url = "https://www.tapology.com/fightcenter?group=major&schedule=upcoming&sport=all"
waitForSelector = "xpath=//*[contains(@class, 'pickDeadlineSidebar')]//tr[.//td]"
entrySelector = "xpath=//*[contains(@class, 'pickDeadlineSidebar')]//tr[.//td]"
titleSelector = ["a", "xpathstr=.//abbr/@title"]
linkSelector = "a"
#dateSelector = "xpathstr=.//abbr/@title"
#dateFormat = "yyyy-MM-dd HH:mm:ss xx"
# this stuff seems to time out with 'load' a lot
waitUntil = "domcontentloaded"

[start_all_back_release_notes]
title = "StartAllBack release notes"
url = "https://www.startallback.com/"
# do not wait here, legacy waitForSelector API requires the element to be visible and it is not by default
#waitForSelector = ".history2"
entrySelector = ".history2"
titleSelector = "xpathstr=./text()[normalize-space()]"
# use the whole element
# contentSelector = "li"

[bellsoft_blog]
title = "The BellSoft Blog"
url = "https://bell-sw.com/blog/"
waitForSelector = "xpath=//*[contains(@class, 'blog_wrapper')]"
entrySelector = "xpath=//*[contains(@class, 'blog_wrapper')]"
titleSelector = "h5"
linkSelector = "a"
contentSelector = "p"

[hacker_news_algolia_top_week]
title = "HN Algolia - top stories (week)"
url = [
  "https://hn.algolia.com/?dateRange=pastWeek&page=0&prefix=false&query=&sort=byPopularity&type=story",
  "https://hn.algolia.com/?dateRange=pastWeek&page=1&prefix=false&query=&sort=byPopularity&type=story",
]
waitForSelector = "article.Story"
entrySelector = "article.Story"
titleSelector = ".Story_title span"
linkSelector = ".Story_title a"
# exclude story name
contentSelector = "xpath=.//*[not(ancestor-or-self::a[1])]"

